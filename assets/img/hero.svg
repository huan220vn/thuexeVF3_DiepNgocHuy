  </g>

  <!-- cửa sổ sáng -->
  <g fill="#22C177" opacity=".34">
    <rect x="330" y="548" width="9" height="13" rx="2"/><rect x="352" y="548" width="9" height="13" rx="2"/>
    <rect x="330" y="580" width="9" height="13" rx="2"/><rect x="352" y="580" width="9" height="13" rx="2"/>
