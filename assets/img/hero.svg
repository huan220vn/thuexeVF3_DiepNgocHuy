<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Nền xe điện thành phố">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B2B1F"/>
      <stop offset=".45" stop-color="#061A13"/>
      <stop offset="1" stop-color="#04100C"/>
    </linearGradient>
    <radialGradient id="glow" cx=".22" cy=".12" r=".75">
      <stop offset="0" stop-color="#12C078" stop-opacity=".42"/>
      <stop offset=".55" stop-color="#0A9155" stop-opacity=".12"/>
      <stop offset="1" stop-color="#0A9155" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".85" cy=".85" r=".6">
      <stop offset="0" stop-color="#B7F34A" stop-opacity=".18"/>
      <stop offset="1" stop-color="#B7F34A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A2018"/>
      <stop offset="1" stop-color="#050E0B"/>
    </linearGradient>
    <linearGradient id="bl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0FB26A" stop-opacity=".85"/>
      <stop offset="1" stop-color="#B7F34A" stop-opacity=".1"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="1080" fill="url(#glow2)"/>

