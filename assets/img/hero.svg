    <rect x="1650" y="600" width="9" height="13" rx="2"/>
  </g>

  <!-- mặt đường -->
  <path d="M0 690h1920v390H0z" fill="url(#road)"/>
  <path d="M0 690h1920v3H0z" fill="#0FB26A" opacity=".5"/>

  <!-- vạch kẻ đường -->
  <g fill="#3BD68F" opacity=".22">
